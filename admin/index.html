<!DOCTYPE html>
<!--
  admin/index.html — Tag Assignment Interface

  This page lets you:
    1. See the last unrecognised NFC tag that was scanned.
    2. Search the card database by name.
    3. Assign that tag to the correct card.
    4. Review and remove existing assignments.

  It calls the REST API endpoints already built into server.py:
    GET  /api/cards/search?q=...
    POST /api/assign          { uid, card_id }
    DELETE /api/assign/:uid
    GET  /api/scans/recent

  No build step or framework needed — plain HTML/CSS/JS so it runs
  in any browser on your local network without installing anything.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rift Tap — Tag Assignment</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #d0d8e8;
      min-height: 100vh;
    }

    /* ── Layout ───────────────────────────────────────────────────────────── */
    header {
      background: #1a1d27;
      border-bottom: 1px solid #2a2d3a;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 {
      margin: 0;
      font-size: 1.2rem;
      color: #f0d070;
      font-weight: 700;
    }
    header .subtitle {
      font-size: 0.8rem;
      color: #6a7a9a;
    }

    /* ── Overlay toggle ─────────────────────────────────────────────── */
    .toggle-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: 24px;
      font-size: 0.82rem;
      color: #a0b8d0;
    }
    .toggle-switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-track {
      position: absolute;
      inset: 0;
      background: #2a2d3a;
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      left: 3px;
      top: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #6a7a9a;
      transition: transform 0.2s, background 0.2s;
    }
    .toggle-switch input:checked + .toggle-track { background: #2a4a2f; }
    .toggle-switch input:checked + .toggle-track::after {
      transform: translateX(18px);
      background: #4caf50;
    }

    /* ── Demo mode button ──────────────────────────────────────────── */
    .demo-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 16px;
    }
    #demo-btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #3a3d4a;
      background: #0f1117;
      color: #a0b8d0;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    #demo-btn:hover { background: #1a1d27; }
    #demo-btn.active {
      background: #1a3a1f;
      color: #4caf50;
      border-color: #2a5a2f;
      animation: pulse-border 2s infinite;
    }
    @keyframes pulse-border {
      0%, 100% { border-color: #2a5a2f; }
      50%       { border-color: #4caf50; }
    }
    .demo-interval {
      width: 44px;
      background: #0f1117;
      border: 1px solid #3a3d4a;
      border-radius: 4px;
      color: #d0d8e8;
      padding: 4px 6px;
      font-size: 0.8rem;
      text-align: center;
    }
    .demo-label { font-size: 0.75rem; color: #4a5a6a; }

    .ws-badge {
      margin-left: auto;
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 20px;
      background: #2a2d3a;
      color: #888;
    }
    .ws-badge.connected { background: #1a3a1f; color: #4caf50; }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 620px) { main { grid-template-columns: 1fr; } }

    /* ── Cards (panel containers) ─────────────────────────────────────────── */
    .panel {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 10px;
      padding: 18px;
    }
    .panel h2 {
      margin: 0 0 14px;
      font-size: 0.95rem;
      color: #a0b8d0;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-bottom: 1px solid #2a2d3a;
      padding-bottom: 10px;
    }
    .panel.full-width { grid-column: 1 / -1; }

    /* ── Scan indicator ───────────────────────────────────────────────────── */
    #scan-uid {
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      color: #f0d070;
      background: #0f1117;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px dashed #3a3d4a;
      word-break: break-all;
      min-height: 44px;
    }
    #scan-status {
      margin-top: 8px;
      font-size: 0.8rem;
      color: #6a7a9a;
    }
    #scan-status.warning { color: #f0a040; }
    #scan-status.ok { color: #4caf50; }

    /* ── Search & assign ──────────────────────────────────────────────────── */
    input[type="text"] {
      width: 100%;
      background: #0f1117;
      border: 1px solid #3a3d4a;
      border-radius: 6px;
      color: #d0d8e8;
      padding: 9px 12px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #f0d070; }

    #search-results {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 240px;
      overflow-y: auto;
    }

    .result-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .result-row:hover, .result-row.selected {
      border-color: #f0d070;
      background: #1f2030;
    }
    .result-name { font-weight: 600; flex: 1; font-size: 0.9rem; }
    .result-meta { font-size: 0.75rem; color: #6a7a9a; }

    /* ── Buttons ──────────────────────────────────────────────────────────── */
    .btn {
      display: inline-block;
      padding: 9px 18px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #f0d070; color: #0f1117; }
    .btn-primary:hover:not(:disabled) { opacity: 0.85; }
    .btn-danger  { background: #5a1a1a; color: #f08080; }
    .btn-danger:hover:not(:disabled)  { background: #7a2a2a; }

    #assign-btn { margin-top: 14px; width: 100%; }

    /* ── Assignment log ───────────────────────────────────────────────────── */
    #assignment-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 320px;
      overflow-y: auto;
    }
    .assign-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 6px;
      font-size: 0.82rem;
    }
    .assign-uid {
      font-family: monospace;
      color: #a0b8d0;
      flex: 1;
      word-break: break-all;
    }
    .assign-name { font-weight: 600; color: #f0d070; }
    .btn-remove {
      background: none;
      border: 1px solid #3a2020;
      color: #906060;
      border-radius: 4px;
      padding: 3px 8px;
      cursor: pointer;
      font-size: 0.75rem;
      white-space: nowrap;
    }
    .btn-remove:hover { background: #3a2020; color: #f08080; }

    .empty-msg {
      font-size: 0.82rem;
      color: #4a5a6a;
      text-align: center;
      padding: 20px 0;
    }

    /* ── Recent scans ─────────────────────────────────────────────────────── */
    #scan-log {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 200px;
      overflow-y: auto;
    }
    .log-row {
      display: flex;
      gap: 10px;
      font-size: 0.8rem;
      padding: 4px 0;
      border-bottom: 1px solid #1e2030;
    }
    .log-time { color: #4a5a6a; white-space: nowrap; }
    .log-uid  { font-family: monospace; color: #6a8aaa; flex: 1; word-break: break-all; }
    .log-card { color: #f0d070; }
    .log-unknown { color: #805050; font-style: italic; }

    /* ── Toast notifications ──────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a3a1f;
      color: #80e090;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      transition: transform 0.3s ease;
      z-index: 999;
      pointer-events: none;
    }
    #toast.error { background: #3a1a1a; color: #e08080; }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Rift Tap — Admin</h1>
    <div class="subtitle">Tag Assignment Interface</div>
  </div>
  <label class="toggle-group" title="Show card name, type, and rules text in the OBS overlay">
    <span>Card info in overlay</span>
    <span class="toggle-switch">
      <input type="checkbox" id="toggle-info" />
      <span class="toggle-track"></span>
    </span>
  </label>
  <div class="demo-group">
    <input class="demo-interval" type="number" id="demo-interval" value="5" min="1" max="60" title="Seconds between demo scans" />
    <span class="demo-label">s</span>
    <button id="demo-btn" title="Fire continuous demo scans so you can position the overlay in OBS">&#9654; Demo</button>
  </div>
  <span id="ws-badge" class="ws-badge">● Connecting…</span>
</header>

<main>

  <!-- ── Last Scan ──────────────────────────────────────────────────────── -->
  <div class="panel">
    <h2>Last Scanned Tag</h2>
    <div id="scan-uid">Waiting for scan…</div>
    <div id="scan-status">Tap a card on the reader</div>
  </div>

  <!-- ── Assign ─────────────────────────────────────────────────────────── -->
  <div class="panel">
    <h2>Assign to Card</h2>
    <input
      type="text"
      id="card-search"
      placeholder="Search card name…"
      autocomplete="off"
    />
    <div id="search-results"></div>
    <button class="btn btn-primary" id="assign-btn" disabled>
      Assign Tag → Card
    </button>
  </div>

  <!-- ── Existing assignments ───────────────────────────────────────────── -->
  <div class="panel full-width">
    <h2>Current Assignments</h2>
    <div id="assignment-list"><p class="empty-msg">Loading…</p></div>
  </div>

  <!-- ── Recent scan log ───────────────────────────────────────────────── -->
  <div class="panel full-width">
    <h2>Recent Scans</h2>
    <div id="scan-log"><p class="empty-msg">Loading…</p></div>
  </div>

</main>

<div id="toast"></div>

<script>
(function () {
  "use strict";

  // ── State ──────────────────────────────────────────────────────────────
  let pendingUid      = null;   // UID of the last unresolved scan
  let selectedCardId  = null;   // card chosen in search results
  let selectedCardName = null;

  // ── DOM refs ───────────────────────────────────────────────────────────
  const scanUidEl       = document.getElementById("scan-uid");
  const scanStatusEl    = document.getElementById("scan-status");
  const cardSearchEl    = document.getElementById("card-search");
  const searchResultsEl = document.getElementById("search-results");
  const assignBtn       = document.getElementById("assign-btn");
  const assignListEl    = document.getElementById("assignment-list");
  const scanLogEl       = document.getElementById("scan-log");
  const wsBadge         = document.getElementById("ws-badge");
  const toastEl         = document.getElementById("toast");

  // ── WebSocket ──────────────────────────────────────────────────────────
  // Same reconnect pattern as the overlay so the admin page survives
  // a server restart mid-session.
  let retryDelay = 1000;

  function connectWs() {
    const ws = new WebSocket(`${location.protocol === "https:" ? "wss:" : "ws:"}//${location.host}/ws`);

    ws.addEventListener("open", () => {
      wsBadge.textContent = "● Live";
      wsBadge.className = "ws-badge connected";
      retryDelay = 1000;
    });

    ws.addEventListener("message", (e) => {
      let msg;
      try { msg = JSON.parse(e.data); } catch { return; }

      if (msg.event === "card_scanned" || msg.event === "unknown_tag") {
        handleIncomingScan(msg);
        refreshScanLog();
      } else if (msg.event === "settings") {
        applySettings(msg);
      } else if (msg.event === "demo_state") {
        applyDemoState(msg);
      }
    });

    ws.addEventListener("close", () => {
      wsBadge.textContent = "● Reconnecting…";
      wsBadge.className = "ws-badge";
      setTimeout(connectWs, retryDelay);
      retryDelay = Math.min(retryDelay * 2, 30000);
    });
  }

  // ── Incoming scan handler ──────────────────────────────────────────────
  function handleIncomingScan(msg) {
    pendingUid = msg.uid;
    scanUidEl.textContent = msg.uid;

    if (msg.event === "card_scanned") {
      scanStatusEl.textContent = `✓ Already assigned to: ${msg.card.name}`;
      scanStatusEl.className = "ok";
    } else {
      scanStatusEl.textContent = "⚠ Unassigned tag — search and assign below";
      scanStatusEl.className = "warning";
    }

    // Keep the selected card intact so the user can assign multiple copies
    // of the same card back-to-back without re-searching.
    // Only the UID and status line update; the search field stays put.
    updateAssignBtn();
  }

  // ── Card search ────────────────────────────────────────────────────────
  let searchTimer = null;

  cardSearchEl.addEventListener("input", () => {
    clearTimeout(searchTimer);
    const q = cardSearchEl.value.trim();
    if (q.length < 2) {
      searchResultsEl.innerHTML = "";
      return;
    }
    // Debounce: wait 250 ms after the user stops typing before fetching.
    // Without this, every keystroke fires a request.
    searchTimer = setTimeout(() => fetchCards(q), 250);
  });

  async function fetchCards(q) {
    try {
      const res = await fetch(`/api/cards/search?q=${encodeURIComponent(q)}`);
      if (!res.ok) throw new Error(res.statusText);
      const cards = await res.json();
      renderSearchResults(cards);
    } catch (err) {
      console.error("Search error:", err);
    }
  }

  function renderSearchResults(cards) {
    if (!cards.length) {
      searchResultsEl.innerHTML = '<div class="empty-msg">No cards found</div>';
      return;
    }
    searchResultsEl.innerHTML = cards.map(c => `
      <div class="result-row" data-id="${c.id}" data-name="${escHtml(c.name)}">
        <span class="result-name">${escHtml(c.name)}</span>
        <span class="result-meta">${escHtml(c.set_code)} · ${escHtml(c.card_type)}</span>
      </div>
    `).join("");

    searchResultsEl.querySelectorAll(".result-row").forEach(row => {
      row.addEventListener("click", () => {
        searchResultsEl.querySelectorAll(".result-row").forEach(r => r.classList.remove("selected"));
        row.classList.add("selected");
        selectedCardId   = row.dataset.id;
        selectedCardName = row.dataset.name;
        updateAssignBtn();
      });
    });
  }

  // ── Assign button ──────────────────────────────────────────────────────
  function updateAssignBtn() {
    assignBtn.disabled = !(pendingUid && selectedCardId);
    if (pendingUid && selectedCardId) {
      assignBtn.textContent = `Assign → ${selectedCardName}`;
    } else {
      assignBtn.textContent = "Assign Tag → Card";
    }
  }

  assignBtn.addEventListener("click", async () => {
    if (!pendingUid || !selectedCardId) return;
    try {
      const res = await fetch("/api/assign", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ uid: pendingUid, card_id: selectedCardId }),
      });
      if (!res.ok) throw new Error(await res.text());
      showToast(`Assigned!  ${pendingUid.slice(0, 14)}… → ${selectedCardName}`);
      // Clear only the UID — keep the card selection so the next scan
      // can be assigned to the same card immediately.
      pendingUid = null;
      scanUidEl.textContent = "Waiting for next scan…";
      scanStatusEl.textContent = `Card locked: ${selectedCardName} — scan next tag or search a new card`;
      scanStatusEl.className = "ok";
      updateAssignBtn();
      refreshAssignments();
    } catch (err) {
      showToast("Error: " + err.message, true);
    }
  });

  // ── Demo mode ───────────────────────────────────────────────────────────
  const demoBtnEl      = document.getElementById("demo-btn");
  const demoIntervalEl = document.getElementById("demo-interval");

  function applyDemoState(state) {
    demoBtnEl.classList.toggle("active", !!state.active);
    demoBtnEl.textContent = state.active ? "⏹ Demo ON" : "▶ Demo";
    if (state.interval) demoIntervalEl.value = state.interval;
  }

  demoBtnEl.addEventListener("click", async () => {
    const turningOn = !demoBtnEl.classList.contains("active");
    try {
      await fetch("/api/demo", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          active:   turningOn,
          interval: parseInt(demoIntervalEl.value, 10) || 5,
        }),
      });
    } catch (err) {
      showToast("Demo error: " + err.message, true);
    }
  });

  // ── Settings ───────────────────────────────────────────────────────────
  const toggleInfoEl = document.getElementById("toggle-info");

  function applySettings(settings) {
    // Keep the checkbox in sync when a settings broadcast arrives
    // (e.g. from another admin tab).
    toggleInfoEl.checked = !!settings.show_card_info;
  }

  toggleInfoEl.addEventListener("change", async () => {
    try {
      await fetch("/api/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ show_card_info: toggleInfoEl.checked }),
      });
      // The server broadcasts the change back via WebSocket, so applySettings
      // will fire for all connected clients including this tab.
    } catch (err) {
      showToast("Settings error: " + err.message, true);
      toggleInfoEl.checked = !toggleInfoEl.checked;  // revert on failure
    }
  });

  // ── Assignments list ───────────────────────────────────────────────────
  async function refreshAssignments() {
    try {
      const res = await fetch("/api/assignments");
      const rows = await res.json();

      if (!rows.length) {
        assignListEl.innerHTML = '<p class="empty-msg">No assignments yet</p>';
        return;
      }

      assignListEl.innerHTML = rows.map(r => `
        <div class="assign-row">
          <span class="assign-uid">${escHtml(r.uid)}</span>
          <span class="assign-name">${escHtml(r.name)}</span>
          <button class="btn-remove" data-uid="${escHtml(r.uid)}">Remove</button>
        </div>
      `).join("");

      assignListEl.querySelectorAll(".btn-remove").forEach(btn => {
        btn.addEventListener("click", () => removeAssignment(btn.dataset.uid));
      });
    } catch (err) {
      console.error("Assignments fetch error:", err);
    }
  }

  async function removeAssignment(uid) {
    if (!confirm(`Remove assignment for tag ${uid}?`)) return;
    try {
      await fetch(`/api/assign/${encodeURIComponent(uid)}`, { method: "DELETE" });
      showToast("Assignment removed");
      refreshAssignments();
    } catch (err) {
      showToast("Error: " + err.message, true);
    }
  }

  // ── Scan log ───────────────────────────────────────────────────────────
  async function refreshScanLog() {
    try {
      const res = await fetch("/api/scans/recent?limit=20");
      const rows = await res.json();
      if (!rows.length) {
        scanLogEl.innerHTML = '<p class="empty-msg">No scans yet</p>';
        return;
      }
      scanLogEl.innerHTML = rows.map(r => `
        <div class="log-row">
          <span class="log-time">${r.scanned_at.replace("T", " ").slice(0, 19)}</span>
          <span class="log-uid">${escHtml(r.uid)}</span>
          ${r.name
            ? `<span class="log-card">${escHtml(r.name)}</span>`
            : `<span class="log-unknown">unassigned</span>`
          }
        </div>
      `).join("");
    } catch (err) {
      console.error("Scan log error:", err);
    }
  }

  // ── Helpers ────────────────────────────────────────────────────────────
  // escHtml prevents any card name or UID with special characters from
  // being interpreted as HTML — a small but important security habit.
  function escHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  let toastTimer = null;
  function showToast(msg, isError = false) {
    toastEl.textContent = msg;
    toastEl.className = isError ? "error show" : "show";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.className = isError ? "error" : ""; }, 3000);
  }

  // ── Boot ───────────────────────────────────────────────────────────────
  connectWs();  // Fetch initial settings so the toggle reflects the server state on load.
  fetch("/api/settings").then(r => r.json()).then(applySettings).catch(console.error);
  fetch("/api/demo").then(r => r.json()).then(applyDemoState).catch(console.error);
  refreshAssignments();
  refreshScanLog();

  // Poll the scan log every 10 s as a fallback in case a WebSocket message
  // is missed.
  setInterval(refreshScanLog, 10_000);
})();
</script>

</body>
</html>
