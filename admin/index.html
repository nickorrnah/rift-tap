<!DOCTYPE html>
<!--
  admin/index.html — Tag Assignment Interface

  This page lets you:
    1. See the last unrecognised NFC tag that was scanned.
    2. Search the card database by name.
    3. Assign that tag to the correct card.
    4. Review and remove existing assignments.

  It calls the REST API endpoints already built into server.py:
    GET  /api/cards/search?q=...
    POST /api/assign          { uid, card_id }
    DELETE /api/assign/:uid
    GET  /api/scans/recent

  No build step or framework needed — plain HTML/CSS/JS so it runs
  in any browser on your local network without installing anything.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rift Tap — Card Assignment</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #d0d8e8;
      min-height: 100vh;
    }

    /* ── Layout ───────────────────────────────────────────────────────────── */
    header {
      background: #1a1d27;
      border-bottom: 1px solid #2a2d3a;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 {
      margin: 0;
      font-size: 1.2rem;
      color: #f0d070;
      font-weight: 700;
    }
    header .subtitle {
      font-size: 0.8rem;
      color: #6a7a9a;
    }

    /* ── Back button & settings link ────────────────────────────────────────── */
    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      color: #a0b8d0;
      text-decoration: none;
      padding: 8px 14px;
      border: 1px solid #2a2d3a;
      border-radius: 8px;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .back-btn:hover { background: #2a2d3a; color: #f0d070; border-color: #f0d070; }
    .settings-link {
      margin-left: auto;
      font-size: 0.82rem;
      color: #a0b8d0;
      text-decoration: none;
      padding: 6px 12px;
      border: 1px solid #2a2d3a;
      border-radius: 6px;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .settings-link:hover { background: #2a2d3a; border-color: #f0d070; color: #f0d070; }

    .ws-badge {
      margin-left: auto;
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 20px;
      background: #2a2d3a;
      color: #888;
    }
    .ws-badge.connected { background: #1a3a1f; color: #4caf50; }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 620px) { main { grid-template-columns: 1fr; } }

    /* ── Cards (panel containers) ─────────────────────────────────────────── */
    .panel {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 10px;
      padding: 18px;
    }
    .panel h2 {
      margin: 0 0 14px;
      font-size: 0.95rem;
      color: #a0b8d0;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-bottom: 1px solid #2a2d3a;
      padding-bottom: 10px;
    }
    .panel.full-width { grid-column: 1 / -1; }

    /* ── Scan indicator ───────────────────────────────────────────────────── */
    #scan-uid {
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      color: #f0d070;
      background: #0f1117;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px dashed #3a3d4a;
      word-break: break-all;
      min-height: 44px;
    }
    #scan-status {
      margin-top: 8px;
      font-size: 0.8rem;
      color: #6a7a9a;
    }
    #scan-status.warning { color: #f0a040; }
    #scan-status.ok { color: #4caf50; }

    /* ── Search & assign ──────────────────────────────────────────────────── */
    input[type="text"] {
      width: 100%;
      background: #0f1117;
      border: 1px solid #3a3d4a;
      border-radius: 6px;
      color: #d0d8e8;
      padding: 9px 12px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #f0d070; }

    #search-results {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 240px;
      overflow-y: auto;
    }

    .result-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .result-row:hover, .result-row.selected {
      border-color: #f0d070;
      background: #1f2030;
    }
    .result-name { font-weight: 600; flex: 1; font-size: 0.9rem; }
    .result-meta { font-size: 0.75rem; color: #6a7a9a; }

    /* ── Buttons ──────────────────────────────────────────────────────────── */
    .btn {
      display: inline-block;
      padding: 9px 18px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #f0d070; color: #0f1117; }
    .btn-primary:hover:not(:disabled) { opacity: 0.85; }
    .btn-danger  { background: #5a1a1a; color: #f08080; }
    .btn-danger:hover:not(:disabled)  { background: #7a2a2a; }

    #assign-btn { margin-top: 14px; width: 100%; }

    /* ── Assignment log ───────────────────────────────────────────────────── */
    #assignment-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 320px;
      overflow-y: auto;
    }
    .assign-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 6px;
      font-size: 0.82rem;
    }
    .assign-uid {
      font-family: monospace;
      color: #a0b8d0;
      flex: 1;
      word-break: break-all;
    }
    .assign-name { font-weight: 600; color: #f0d070; }
    .btn-remove {
      background: none;
      border: 1px solid #3a2020;
      color: #906060;
      border-radius: 4px;
      padding: 3px 8px;
      cursor: pointer;
      font-size: 0.75rem;
      white-space: nowrap;
    }
    .btn-remove:hover { background: #3a2020; color: #f08080; }

    .empty-msg {
      font-size: 0.82rem;
      color: #4a5a6a;
      text-align: center;
      padding: 20px 0;
    }

    /* ── Recent scans ─────────────────────────────────────────────────────── */
    #scan-log {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 200px;
      overflow-y: auto;
    }
    .log-row {
      display: flex;
      gap: 10px;
      font-size: 0.8rem;
      padding: 4px 0;
      border-bottom: 1px solid #1e2030;
    }
    .log-time { color: #4a5a6a; white-space: nowrap; }
    .log-uid  { font-family: monospace; color: #6a8aaa; flex: 1; word-break: break-all; }
    .log-card { color: #f0d070; }
    .log-unknown { color: #805050; font-style: italic; }

    /* ── Toast notifications ──────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a3a1f;
      color: #80e090;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      transition: transform 0.3s ease;
      z-index: 999;
      pointer-events: none;
    }
    #toast.error { background: #3a1a1a; color: #e08080; }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<header>
  <a class="back-btn" href="/">← Back</a>
  <div>
    <h1>Rift Tap — Card Assignment</h1>
    <div class="subtitle">Assign NFC tags to cards</div>
  </div>
  <a class="settings-link" href="/admin/settings.html" title="Settings">⚙️ Settings</a>
  <span id="ws-badge" class="ws-badge">● Connecting…</span>
</header>

<main>

  <!-- ── Last Scan ──────────────────────────────────────────────────────── -->
  <div class="panel">
    <h2>Last Scanned Tag</h2>
    <div id="scan-uid">Waiting for scan…</div>
    <div id="scan-status">Tap a card on the reader</div>
  </div>

  <!-- ── Assign ─────────────────────────────────────────────────────────── -->
  <div class="panel">
    <h2>Write to Tag</h2>
    <input
      type="text"
      id="card-search"
      placeholder="Search card name…"
      autocomplete="off"
    />
    <div id="search-results"></div>
    <button class="btn btn-primary" id="assign-btn" disabled>
        Write to Tag
      </button>
  </div>

  <!-- ── Existing assignments ───────────────────────────────────────────── -->
  <div class="panel full-width">
    <h2>Current Assignments</h2>
    <div id="assignment-list"><p class="empty-msg">Loading…</p></div>
  </div>

  <!-- ── Recent scan log ───────────────────────────────────────────────── -->
  <div class="panel full-width">
    <h2>Recent Scans</h2>
    <div id="scan-log"><p class="empty-msg">Loading…</p></div>
  </div>

</main>

<div id="toast"></div>

<script>
(function () {
  "use strict";

  // ── State ──────────────────────────────────────────────────────────────
  let pendingUid      = null;   // UID of the last unresolved scan
  let selectedCardId  = null;   // card chosen in search results
  let selectedCardName = null;

  // ── DOM refs ───────────────────────────────────────────────────────────
  const scanUidEl       = document.getElementById("scan-uid");
  const scanStatusEl    = document.getElementById("scan-status");
  const cardSearchEl    = document.getElementById("card-search");
  const searchResultsEl = document.getElementById("search-results");
  const assignBtn       = document.getElementById("assign-btn");
  const assignListEl    = document.getElementById("assignment-list");
  const scanLogEl       = document.getElementById("scan-log");
  const wsBadge         = document.getElementById("ws-badge");
  const toastEl         = document.getElementById("toast");

  // ── WebSocket ──────────────────────────────────────────────────────────
  // Same reconnect pattern as the overlay so the admin page survives
  // a server restart mid-session.
  let retryDelay = 1000;

  function connectWs() {
    const ws = new WebSocket(`${location.protocol === "https:" ? "wss:" : "ws:"}//${location.host}/ws`);

    ws.addEventListener("open", () => {
      wsBadge.textContent = "● Live";
      wsBadge.className = "ws-badge connected";
      retryDelay = 1000;
    });

    ws.addEventListener("message", (e) => {
      let msg;
      try { msg = JSON.parse(e.data); } catch { return; }

      if (msg.event === "card_scanned" || msg.event === "blank_tag" || msg.event === "unknown_card_id") {
        handleIncomingScan(msg);
        refreshScanLog();
      } else if (msg.event === "tag_written") {
        handleTagWritten(msg);
        refreshAssignments();
        refreshScanLog();
      } else if (msg.event === "write_failed") {
        showToast("Write failed — hold the card flat on the reader and try again", true);
        assignBtn.disabled = false;
        assignBtn.textContent = `Write to Tag → ${selectedCardName}`;
      } else if (msg.event === "write_timeout") {
        showToast("Timed out — no tag detected within 30 seconds", true);
        assignBtn.disabled = false;
        assignBtn.textContent = `Write to Tag → ${selectedCardName}`;
      } else if (msg.event === "settings") {
        applySettings(msg);
      } else if (msg.event === "demo_state") {
        applyDemoState(msg);
      }
    });

    ws.addEventListener("close", () => {
      wsBadge.textContent = "● Reconnecting…";
      wsBadge.className = "ws-badge";
      setTimeout(connectWs, retryDelay);
      retryDelay = Math.min(retryDelay * 2, 30000);
    });
  }

  // ── Incoming scan handler ──────────────────────────────────────────────
  function handleIncomingScan(msg) {
    pendingUid = msg.uid;
    scanUidEl.textContent = msg.uid;

    if (msg.event === "card_scanned") {
      // Tag already has a card ID written on it
      scanStatusEl.textContent = `✓ Tag contains: ${msg.card.name}`;
      scanStatusEl.className = "ok";
    } else if (msg.event === "unknown_card_id") {
      // Tag has a card ID but it’s not in this device’s database
      scanStatusEl.textContent = `⚠ Card ID “${msg.card_id.toUpperCase()}” not in local library — update cards first`;
      scanStatusEl.className = "warning";
    } else {
      // blank_tag: no card ID on tag yet
      scanStatusEl.textContent = "□ Blank tag — search for a card and write to it";
      scanStatusEl.className = "warning";
    }

    updateAssignBtn();
  }

  function handleTagWritten(msg) {
    showToast(`Written! ${escHtml(msg.card_id.toUpperCase())} → tag`);
    pendingUid = null;
    scanUidEl.textContent = "Waiting for next scan…";
    scanStatusEl.textContent = `Card locked: ${selectedCardName} — tap next sleeve or search a new card`;
    scanStatusEl.className = "ok";
    assignBtn.disabled = false;
    updateAssignBtn();
  }

  // ── Card search ────────────────────────────────────────────────────────
  let searchTimer = null;

  cardSearchEl.addEventListener("input", () => {
    clearTimeout(searchTimer);
    const q = cardSearchEl.value.trim();
    if (q.length < 2) {
      searchResultsEl.innerHTML = "";
      return;
    }
    // Debounce: wait 250 ms after the user stops typing before fetching.
    // Without this, every keystroke fires a request.
    searchTimer = setTimeout(() => fetchCards(q), 250);
  });

  async function fetchCards(q) {
    try {
      const res = await fetch(`/api/cards/search?q=${encodeURIComponent(q)}`);
      if (!res.ok) throw new Error(res.statusText);
      const cards = await res.json();
      renderSearchResults(cards);
    } catch (err) {
      console.error("Search error:", err);
    }
  }

  function renderSearchResults(cards) {
    if (!cards.length) {
      searchResultsEl.innerHTML = '<div class="empty-msg">No cards found</div>';
      return;
    }
    searchResultsEl.innerHTML = cards.map(c => `
      <div class="result-row" data-id="${c.id}" data-name="${escHtml(c.name)}">
        <span class="result-name">${escHtml(c.name)}</span>
        <span class="result-meta">${escHtml(c.id)}${c.card_type ? ' · ' + escHtml(c.card_type) : ''}</span>
      </div>
    `).join("");

    searchResultsEl.querySelectorAll(".result-row").forEach(row => {
      row.addEventListener("click", () => {
        searchResultsEl.querySelectorAll(".result-row").forEach(r => r.classList.remove("selected"));
        row.classList.add("selected");
        selectedCardId   = row.dataset.id;
        selectedCardName = row.dataset.name;
        updateAssignBtn();
      });
    });
  }

  // ── Write button ──────────────────────────────────────────────────────
  function updateAssignBtn() {
    assignBtn.disabled = !selectedCardId;
    if (selectedCardId) {
      assignBtn.textContent = pendingUid
        ? `Write to Tag → ${selectedCardName}`
        : `Write to Tag → ${selectedCardName} (tap a sleeve)`;
    } else {
      assignBtn.textContent = "Write to Tag";
    }
  }

  assignBtn.addEventListener("click", async () => {
    if (!selectedCardId) return;
    try {
      assignBtn.disabled = true;
      assignBtn.textContent = "Waiting for tag…";
      const res = await fetch("/api/write-tag", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ card_id: selectedCardId }),
      });
      if (!res.ok) throw new Error(await res.text());
      scanStatusEl.textContent = `Hold sleeve on reader to write ${selectedCardName}…`;
      scanStatusEl.className = "ok";
      // Result arrives via WebSocket: tag_written, write_failed, or write_timeout
    } catch (err) {
      showToast("Error: " + err.message, true);
      assignBtn.disabled = false;
      updateAssignBtn();
    }
  });

  // Demo/settings controls live on settings.html — these are no-op stubs
  // so WebSocket broadcasts don't throw when they arrive on this page.
  function applyDemoState(state) {}
  function applySettings(settings) {}

  // ── Assignments list ───────────────────────────────────────────────────
  async function refreshAssignments() {
    try {
      const res = await fetch("/api/assignments");
      const rows = await res.json();

      if (!rows.length) {
        assignListEl.innerHTML = '<p class="empty-msg">No assignments yet</p>';
        return;
      }

      assignListEl.innerHTML = rows.map(r => `
        <div class="assign-row">
          <span class="assign-uid">${escHtml(r.uid)}</span>
          <span class="assign-name">${escHtml(r.name)}</span>
          <button class="btn-remove" data-uid="${escHtml(r.uid)}">Remove</button>
        </div>
      `).join("");

      assignListEl.querySelectorAll(".btn-remove").forEach(btn => {
        btn.addEventListener("click", () => removeAssignment(btn.dataset.uid));
      });
    } catch (err) {
      console.error("Assignments fetch error:", err);
    }
  }

  async function removeAssignment(uid) {
    if (!confirm(`Remove assignment for tag ${uid}?`)) return;
    try {
      await fetch(`/api/assign/${encodeURIComponent(uid)}`, { method: "DELETE" });
      showToast("Assignment removed");
      refreshAssignments();
    } catch (err) {
      showToast("Error: " + err.message, true);
    }
  }

  // ── Scan log ───────────────────────────────────────────────────────────
  async function refreshScanLog() {
    try {
      const res = await fetch("/api/scans/recent?limit=20");
      const rows = await res.json();
      if (!rows.length) {
        scanLogEl.innerHTML = '<p class="empty-msg">No scans yet</p>';
        return;
      }
      scanLogEl.innerHTML = rows.map(r => `
        <div class="log-row">
          <span class="log-time">${r.scanned_at.replace("T", " ").slice(0, 19)}</span>
          <span class="log-uid">${escHtml(r.uid)}</span>
          ${r.name
            ? `<span class="log-card">${escHtml(r.name)}</span>`
            : `<span class="log-unknown">unassigned</span>`
          }
        </div>
      `).join("");
    } catch (err) {
      console.error("Scan log error:", err);
    }
  }

  // ── Helpers ────────────────────────────────────────────────────────────
  // escHtml prevents any card name or UID with special characters from
  // being interpreted as HTML — a small but important security habit.
  function escHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  let toastTimer = null;
  function showToast(msg, isError = false) {
    toastEl.textContent = msg;
    toastEl.className = isError ? "error show" : "show";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.className = isError ? "error" : ""; }, 3000);
  }

  // ── Boot ───────────────────────────────────────────────────────────────
  connectWs();
  refreshAssignments();
  refreshScanLog();

  // Poll the scan log every 10 s as a fallback in case a WebSocket message
  // is missed.
  setInterval(refreshScanLog, 10_000);
})();
</script>

</body>
</html>
